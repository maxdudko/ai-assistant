name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    # Schema uses env("DATABASE_URL") / env("DATABASE_URL_UNPOOLED"); validate/generate
    # only need syntactically valid URLs, not a running database.
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/pma
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@127.0.0.1:5432/pma
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format

      - name: Prisma validate
        run: pnpm --filter @ai/api exec prisma validate

      - name: Prisma generate
        run: pnpm --filter @ai/api exec prisma generate

      - name: Build
        run: pnpm build

      - name: API tests
        run: pnpm --filter @ai/api test
