# Bind-mounts source into api/web so Next and Nest hot-reload without rebuilding images.
# Rebuild only when Dockerfiles or package dependencies change:
#   docker compose -f compose.dev.yaml up --build
#
# After a dependency change, recreate anonymous node_modules volumes:
#   docker compose -f compose.dev.yaml down && docker compose -f compose.dev.yaml up --build

services:
  api:
    image: ai-assistant-api
    working_dir: /app
    env_file:
      - apps/api/.env
    command:
      - sh
      - -c
      - pnpm --filter @ai/api exec prisma migrate deploy && exec pnpm turbo dev --filter=@ai/api
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/pma
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@db:5432/pma
      # Ollama runs in the ollama service — localhost would point at the api container itself
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: gemma3:1b
      OLLAMA_EMBED_MODEL: nomic-embed-text
      EMBEDDING_DIM: '3072'
      # File logging: use PMA_API_LOG_FILE (not LOG_FILE_DIR/NAME) so nothing treats env as a cd target.
      PMA_API_LOG_FILE: /app/logs/api.log
      # File events often do not propagate into containers; poll so nest --watch sees host edits.
      CHOKIDAR_USEPOLLING: 'true'
      CHOKIDAR_INTERVAL: '1000'
      TSC_WATCHFILE: UsePollingWithTimeoutPoll
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/apps/web/node_modules
      - /app/packages/ai-core/node_modules
      - /app/packages/shared-types/node_modules
      - /app/apps/api/dist
      - /app/packages/ai-core/dist
      - ./logs:/app/logs
    build:
      context: .
      dockerfile: infra/docker/api.dev.Dockerfile
    ports:
      - '4000:4000'
    depends_on:
      db:
        condition: service_healthy

  # Embeddings + optional local LLM (host :11434). Models pulled before api starts.
  ollama:
    image: ollama/ollama:latest
    profiles: ['ollama']
    ports:
      - '11434:11434'
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # One-shot: embedding + chat models for api (matches OLLAMA_* env). Idempotent.
  ollama-models-pull:
    image: ollama/ollama:latest
    profiles: ['ollama']
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint:
      - /bin/sh
      - -c
      - set -eu; ollama pull nomic-embed-text; ollama pull gemma3:1b
    restart: 'no'

  web:
    image: ai-assistant-web
    working_dir: /app
    # --webpack so WATCHPACK_POLLING applies (Turbopack ignores watchpack).
    command: pnpm turbo dev --filter=@ai/web -- --webpack --hostname 0.0.0.0
    environment:
      # File events often do not propagate into containers; poll so Next Fast Refresh sees host edits.
      WATCHPACK_POLLING: 'true'
      CHOKIDAR_USEPOLLING: 'true'
      CHOKIDAR_INTERVAL: '1000'
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/apps/web/node_modules
      - /app/packages/ai-core/node_modules
      - /app/packages/shared-types/node_modules
      - /app/apps/web/.next
    build:
      context: .
      dockerfile: infra/docker/web.dev.Dockerfile
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_started

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: pma
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d pma']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
  ollama_data:
